<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<!-- Only this site's own code runs; AI calls may go to any https endpoint (or a local server) the user sets. See SECURITY.md. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aetherstory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #14111f; --panel: #1e1a2e; --line: #322b4a; --text: #ece8f5; --muted: #9d95b5;
    --accent: #c792ea; --accent2: #ff9ec7; --danger: #ff6b81; --ok: #8fe3a4;
    --raised: linear-gradient(160deg, #272140, #1e1a2e); --shadow: 0 6px 18px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05); --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.5);
    font-family: Georgia, 'Iowan Old Style', serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(120% 60% at 50% 0%, #241d3a 0%, var(--bg) 60%) fixed, var(--bg); color: var(--text); padding-bottom: calc(96px + env(safe-area-inset-bottom)); min-height: 100vh; }
  header { padding: calc(14px + env(safe-area-inset-top)) 16px 8px; display: flex; align-items: baseline; gap: 10px; max-width: 760px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.5rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header small { color: var(--muted); font: 0.85rem system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 24px; }
  /* Floating tab bar: a rounded pill that sits above the iPhone home indicator. */
  nav { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: flex; gap: 4px; padding: 6px;
    background: rgba(30, 26, 46, 0.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-lg); z-index: 5; }
  nav[hidden] { display: none; }
  nav button { flex: 1; background: none; border: 0; border-radius: 18px; color: var(--muted); padding: 7px 0 8px; font: 0.72rem system-ui, sans-serif; cursor: pointer; transition: background 0.15s, color 0.15s; }
  nav button span { display: block; font-size: 1.3rem; margin-bottom: 1px; }
  nav button.on { color: var(--text); background: linear-gradient(160deg, #46336a, #33284f); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  h2 { font-size: 1.15rem; margin: 18px 0 10px; }
  label { display: block; font: 0.85rem system-ui, sans-serif; color: var(--muted); margin: 12px 0 4px; }
  input, textarea, select { width: 100%; background: #171327; color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; font: 1rem system-ui, sans-serif; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 80px; resize: vertical; }
  button.btn { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #1a1426; border: 0; border-radius: 16px; padding: 12px 18px; font: 600 1rem system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 16px rgba(199, 146, 234, 0.3); transition: transform 0.1s; }
  button.btn:active, .card:active, .chip:active { transform: scale(0.98); }
  button.btn.ghost { background: var(--raised); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); }
  button.btn.danger { background: none; color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--raised); color: var(--text); border-radius: 999px; padding: 8px 15px; font: 0.95rem system-ui, sans-serif; cursor: pointer; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); }
  .chip.on { border-color: var(--accent); background: linear-gradient(160deg, #4d3672, #3a2b55); }
  .card, .box { background: var(--raised); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; margin: 12px 0; cursor: pointer; box-shadow: var(--shadow); }
  .box { cursor: default; padding: 16px; }
  .box > h3:first-child { margin-top: 0; }
  .box > label:first-of-type { margin-top: 4px; }
  .card.go { display: flex; align-items: center; gap: 12px; }
  .card.go > div { flex: 1; }
  .card .ico { font-size: 1.5rem; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 14px; background: rgba(199, 146, 234, 0.14); }
  .card.go .arrow { color: var(--muted); font-size: 1.3rem; }
  details.box > summary { margin: 0; color: var(--text); font-weight: 600; }
  h3 { font-size: 1rem; margin: 18px 0 6px; }
  .card h3 { margin: 0 0 4px; font-size: 1.05rem; }
    a { color: var(--accent); }
  summary { cursor: pointer; color: var(--muted); font: 0.95rem system-ui, sans-serif; margin-top: 18px; }
  .back { margin-top: 4px; }
  .card.setup { cursor: default; }
  ol.steps { margin: 10px 0; padding-left: 22px; font: 0.95rem/1.5 system-ui, sans-serif; }
  ol.steps li { margin: 6px 0; }
  .card .face { float: left; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin: 0 12px 0 0; box-shadow: 0 0 0 2px var(--line); }
  .card::after { content: ''; display: block; clear: both; }
  img.portrait { display: block; width: 100%; max-width: 280px; border-radius: 20px; margin: 0 auto 10px; box-shadow: var(--shadow-lg); }
  img.portrait[hidden] { display: none; }
  .card p { margin: 0; color: var(--muted); font: 0.9rem/1.4 system-ui, sans-serif; }
  .prose { white-space: pre-wrap; line-height: 1.7; font-size: 1.08rem; }
  .comic figure { margin: 0 0 18px; }
  .comic img, .comic .ph { display: block; width: 100%; border-radius: 16px; box-shadow: var(--shadow-lg); }
  .comic .ph { aspect-ratio: 2 / 3; background: var(--panel); border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font: 0.9rem system-ui, sans-serif; }
  .comic .cap { background: #f3ead2; color: #222; padding: 6px 10px; border-radius: 6px; margin: 8px 0 0; font: italic 0.95rem system-ui, sans-serif; }
  .comic .bubble { background: #fff; color: #111; border-radius: 16px; padding: 8px 12px; margin: 8px 0 0; font: 0.95rem/1.4 system-ui, sans-serif; }
  .comic .chip { margin-top: 8px; }
  .muted { color: var(--muted); font: 0.9rem system-ui, sans-serif; }
  .status { color: var(--accent); font: 0.9rem/1.45 system-ui, sans-serif; margin-top: 10px; white-space: pre-line; }
  .status:not(:empty) { background: rgba(199, 146, 234, 0.1); border: 1px solid rgba(199, 146, 234, 0.25); border-radius: 14px; padding: 10px 12px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font: 0.95rem/1.5 system-ui, sans-serif; }
  body.hide main { filter: blur(24px); }
  .card p.old { color: var(--danger); text-decoration: line-through; white-space: pre-wrap; }
  .card p.new { color: #8fe3a4; white-space: pre-wrap; margin-top: 6px; }
  details.log ul.dev { list-style: none; padding-left: 0; }
  details.log li.fail { color: var(--danger); }
  .bubble { white-space: pre-wrap; line-height: 1.5; padding: 10px 14px; border-radius: 18px; margin: 8px 0; border: 1px solid var(--line); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); }
  .bubble.user { background: #3a2b55; margin-left: 12%; }
  .bubble.assistant { background: var(--panel); margin-right: 12%; }
  input[type=range].spice { padding: 0; border: 0; background: none; accent-color: var(--accent); }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font: 0.8rem system-ui, sans-serif; }
  code { background: #2a2440; border-radius: 5px; padding: 1px 5px; font: 0.88em ui-monospace, Consolas, monospace; word-break: break-all; user-select: all; }
  p.help, .help li { font: 0.95rem/1.55 system-ui, sans-serif; white-space: pre-line; }
  details.help summary { color: var(--text); margin-top: 12px; }
  ul.dev { margin: 6px 0; padding-left: 18px; color: var(--muted); font: 0.9rem/1.5 system-ui, sans-serif; }
  /* The pop-up for slow jobs (pictures, photos, AI helpers): each step, what is happening now, and Cancel. */
  #job { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    background: rgba(8, 6, 16, 0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #job[hidden], #jobPill[hidden] { display: none; }
  #job .sheet { width: 100%; max-width: 420px; background: linear-gradient(160deg, #2c2446, #1e1a2e); border: 1px solid var(--line); border-radius: 26px; padding: 22px 20px 18px;
    box-shadow: var(--shadow-lg); font: 0.95rem/1.5 system-ui, sans-serif; animation: pop 0.18s ease-out; }
  #job h2 { margin: 0; font-family: Georgia, serif; }
  #job ul { list-style: none; padding: 0; margin: 14px 0; }
  #job li { display: flex; gap: 10px; align-items: center; padding: 5px 0; color: var(--muted); }
  #job li .ic { width: 18px; text-align: center; flex: none; }
  #job li.run { color: var(--text); font-weight: 600; }
  #job li.ok { color: var(--ok); }
  #job li.fail { color: var(--danger); }
  #job .detail { background: rgba(0, 0, 0, 0.25); border-radius: 14px; padding: 10px 12px; margin: 0; white-space: pre-line; color: var(--text); }
  #job .detail.fail { color: var(--danger); }
  #job .row { justify-content: flex-end; }
  #jobPill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 6; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px);
    background: linear-gradient(160deg, #46336a, #33284f); color: var(--text); border: 1px solid var(--accent); border-radius: 999px; padding: 9px 16px; font: 0.9rem system-ui, sans-serif; box-shadow: var(--shadow-lg); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spinner { width: 16px; height: 16px; flex: none; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } }
</style>
</head>
<body>
<header><h1>Aetherstory</h1><small id="worldName"></small></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="job" hidden></div>
<button id="jobPill" hidden></button>
<script src="lib.js"></script>
<script src="help.js"></script>
<script src="app.js"></script>
</body>
</html>
