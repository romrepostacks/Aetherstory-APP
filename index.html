<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<!-- Only this site's own code runs; AI calls may go to any https endpoint (or a local server) the user sets. See SECURITY.md. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aetherstory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #14111f; --panel: #1e1a2e; --line: #322b4a; --text: #ece8f5; --muted: #9d95b5;
    --accent: #c792ea; --accent2: #ff9ec7; --danger: #ff6b81;
    font-family: Georgia, 'Iowan Old Style', serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  header { padding: calc(14px + env(safe-area-inset-top)) 16px 8px; display: flex; align-items: baseline; gap: 10px; }
  header h1 { margin: 0; font-size: 1.4rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header small { color: var(--muted); }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 24px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav[hidden] { display: none; }
  nav button { flex: 1; background: none; border: 0; color: var(--muted); padding: 10px 0 12px; font: 0.8rem system-ui, sans-serif; cursor: pointer; }
  nav button span { display: block; font-size: 1.3rem; }
  nav button.on { color: var(--accent); }
  h2 { font-size: 1.15rem; margin: 18px 0 10px; }
  label { display: block; font: 0.85rem system-ui, sans-serif; color: var(--muted); margin: 12px 0 4px; }
  input, textarea, select { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 1rem system-ui, sans-serif; }
  textarea { min-height: 80px; resize: vertical; }
  button.btn { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #1a1426; border: 0; border-radius: 10px; padding: 11px 16px; font: 600 1rem system-ui, sans-serif; cursor: pointer; }
  button.btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  button.btn.danger { background: none; color: var(--danger); border: 1px solid var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 7px 14px; font: 0.95rem system-ui, sans-serif; cursor: pointer; }
  .chip.on { border-color: var(--accent); background: #3a2b55; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; cursor: pointer; }
  h3 { font-size: 1rem; margin: 18px 0 6px; }
  .card h3 { margin: 0 0 4px; font-size: 1.05rem; }
    a { color: var(--accent); }
  summary { cursor: pointer; color: var(--muted); font: 0.95rem system-ui, sans-serif; margin-top: 18px; }
  .card.setup { cursor: default; }
  ol.steps { margin: 10px 0; padding-left: 22px; font: 0.95rem/1.5 system-ui, sans-serif; }
  ol.steps li { margin: 6px 0; }
  .card p { margin: 0; color: var(--muted); font: 0.9rem/1.4 system-ui, sans-serif; }
  .prose { white-space: pre-wrap; line-height: 1.7; font-size: 1.08rem; }
  .muted { color: var(--muted); font: 0.9rem system-ui, sans-serif; }
  .status { color: var(--accent); font: 0.9rem system-ui, sans-serif; min-height: 1.2em; margin-top: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font: 0.95rem/1.5 system-ui, sans-serif; }
  body.hide main { filter: blur(24px); }
  .card p.old { color: var(--danger); text-decoration: line-through; white-space: pre-wrap; }
  .card p.new { color: #8fe3a4; white-space: pre-wrap; margin-top: 6px; }
  details.log ul.dev { list-style: none; padding-left: 0; }
  details.log li.fail { color: var(--danger); }
  ul.dev { margin: 6px 0; padding-left: 18px; color: var(--muted); font: 0.9rem/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<header><h1>Aetherstory</h1><small id="worldName"></small></header>
<main id="view"></main>
<nav id="nav"></nav>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
